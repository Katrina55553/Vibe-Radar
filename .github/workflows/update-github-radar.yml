name: Update GitHub radar

on:
  workflow_dispatch:
  schedule:
    - cron: "7 8 * * 5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

concurrency:
  group: update-github-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch GitHub candidates
        run: npm run update:github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify generated site
        run: |
          npm test
          npm run build

      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- src/data/github.snapshot.json src/data/github.history.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github.snapshot.json src/data/github.history.json
          git commit -m "chore: refresh GitHub radar data"
          git push
